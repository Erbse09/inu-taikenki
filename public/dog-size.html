<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>犬のサイズから犬用品を探す | 犬用品みんなの体験記</title><meta name="description" content="550件の公開体験データから、小型犬・中型犬・大型犬に近い犬用品体験を全カテゴリ横断で探せます。"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#3a312b;background:#fffdf9;line-height:1.65}main{max-width:760px;margin:auto;padding:24px 18px 60px}a{color:inherit}.back{font-size:13px;color:#776b62;text-decoration:none}.eyebrow{color:#e58a3c;font-size:12px;font-weight:800;letter-spacing:.08em;margin-top:24px}h1{font-size:29px;margin:6px 0 8px}p{color:#766b63}.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.size{border:1px solid #eee3d8;border-radius:18px;background:white;padding:15px 8px;text-align:center;font-weight:800;cursor:pointer}.size.active{border:2px solid #ef9446;background:#fff8ef}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin:14px 0}.cat{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#f5f1ed;color:#5d544d}.cat.active{background:#ef9446;color:white}.summary{background:#fff5e9;border-radius:18px;padding:17px;margin:18px 0;font-weight:700}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #eee3d8;border-radius:18px;padding:17px}.category{display:inline-block;background:#f3efeb;border-radius:7px;padding:3px 8px;font-size:10px}.card h2{font-size:18px;margin:8px 0 5px}.meta{font-size:11px;color:#8b8078;margin-bottom:8px}.text{font-size:13px;margin:0}.source{display:inline-block;margin-top:10px;font-size:11px;color:#c86e27}.more{width:100%;margin-top:16px;padding:14px;border:1px solid #eadfd5;border-radius:14px;background:white;font-weight:800}.note{font-size:11px;color:#91857d;margin-top:24px}@media(max-width:390px){h1{font-size:25px}.size{font-size:13px;padding:13px 4px}}</style></head><body><main><a class="back" href="/">🏠 トップへ</a><div class="eyebrow">FIND BY DOG SIZE</div><h1>🐾 うちの子から探す</h1><p>550件の公開体験を横断して、犬のサイズが書かれている体験だけを集めます。書かれていない犬情報は推測しません。</p><div class="sizes"><button class="size" data-size="small">小型犬<br><small>チワワ・ポメなど</small></button><button class="size" data-size="medium">中型犬<br><small>柴犬・コーギーなど</small></button><button class="size" data-size="large">大型犬<br><small>ゴールデンなど</small></button></div><div class="cats"><button class="cat active" data-cat="">すべて</button><button class="cat" data-cat="dog-shampoo">シャンプー</button><button class="cat" data-cat="dog-conditioner">コンディショナー</button><button class="cat" data-cat="pet-dryer">ドライヤー</button><button class="cat" data-cat="brush-slicker">ブラシ</button><button class="cat" data-cat="dog-nail-clipper">爪切り</button><button class="cat" data-cat="auto-feeder">自動給餌器</button></div><div id="summary" class="summary">体験データを読み込んでいます…</div><div id="cards" class="cards"></div><button id="more" class="more" hidden>もっと見る</button><p class="note">※ 売上・人気ランキングではありません。公開体験データのうち、選んだ犬サイズが明記された体験を探しやすく表示しています。</p></main><script>const labels={'dog-shampoo':'犬用シャンプー','dog-conditioner':'コンディショナー','pet-dryer':'ペットドライヤー','brush-slicker':'スリッカーブラシ','brush-comb':'コーム','brush-pin':'ピンブラシ','brush-undercoat':'アンダーコートブラシ','dog-nail-clipper':'犬用爪切り','dog-nail-grinder':'爪やすり','dog-clipper':'犬用バリカン','auto-feeder':'自動給餌器'};let all=[],size=new URLSearchParams(location.search).get('size')||'small',cat='',shown=12;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.querySelectorAll('.size').forEach(b=>b.classList.toggle('active',b.dataset.size===size));document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));const rows=all.filter(r=>String(r.dog_size||'').toLowerCase()===size&&(!cat||r.category===cat));const names={small:'小型犬',medium:'中型犬',large:'大型犬'};document.querySelector('#summary').textContent=`${names[size]}の体験 ${rows.length}件${cat?' / '+(labels[cat]||cat):' / 全カテゴリ横断'}`;document.querySelector('#cards').innerHTML=rows.slice(0,shown).map(r=>`<article class="card"><span class="category">${esc(labels[r.category]||r.category)}</span><h2>${esc(r.product_name)}</h2><div class="meta">${esc(r.dog_breed||names[size])}</div><p class="text">${esc(r.summary)}</p>${/^https?:\/\//.test(r.source_url||'')?`<a class="source" target="_blank" rel="noopener" href="${esc(r.source_url)}">体験の出典を見る →</a>`:''}</article>`).join('')||'<article class="card">この条件で犬サイズが明記された体験はまだありません。</article>';const more=document.querySelector('#more');more.hidden=shown>=rows.length;more.textContent=`もっと見る（残り${Math.max(0,rows.length-shown)}件）`;}document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=b.dataset.size;shown=12;history.replaceState(null,'',`?size=${size}`);render()});document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;shown=12;render()});document.querySelector('#more').onclick=()=>{shown+=12;render()};fetch('/api/reviews').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{all=d.reviews||[];render()}).catch(()=>document.querySelector('#summary').textContent='体験データを読み込めませんでした。時間をおいて再度お試しください。');</script></body></html>
