<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>犬のサイズから犬用品を探す | 犬用品みんなの体験記</title><meta name="description" content="550件の公開体験データから、小型犬・中型犬・大型犬に近い犬用品を全11カテゴリ横断で探せます。"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;color:#3a312b;background:#fffdf9;line-height:1.65}main{max-width:760px;margin:auto;padding:24px 18px 60px}a{color:inherit}.back{font-size:13px;color:#776b62;text-decoration:none}.eyebrow{color:#e58a3c;font-size:12px;font-weight:800;letter-spacing:.08em;margin-top:24px}h1{font-size:29px;margin:6px 0 8px}p{color:#766b63}.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.size{border:1px solid #eee3d8;border-radius:18px;background:white;padding:12px 8px 14px;text-align:center;font-weight:800;cursor:pointer}.size.active{border:2px solid #ef9446;background:#fff8ef}.size img{display:block;width:100%;height:92px;object-fit:contain;margin:0 auto 8px}.size[data-size="medium"] img{transform:scale(.9)}.size strong{display:block;font-size:14px}.size small{display:block;font-weight:500;color:#8a7e75;font-size:10px;line-height:1.4;margin-top:3px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:8px;margin:14px 0;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cat{white-space:nowrap;border:0;border-radius:999px;padding:9px 13px;background:#f5f1ed;color:#5d544d}.cat.active{background:#ef9446;color:white}.summary{display:flex;align-items:center;gap:13px;background:linear-gradient(145deg,#fff7ed,#ffe8d0);border:1px solid #f2dfcc;border-radius:18px;padding:15px 17px;margin:18px 0}.summary img{width:64px;height:64px;object-fit:contain;border-radius:50%;background:rgba(255,255,255,.68);padding:4px}.summary-text b{display:block;font-size:18px}.summary-text span{font-size:11px;color:#806f63}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid #eee3d8;border-radius:18px;padding:17px;box-shadow:0 6px 20px rgba(80,55,35,.04)}.category{display:inline-block;background:#f3efeb;border-radius:7px;padding:3px 8px;font-size:10px}.card h2{font-size:18px;margin:8px 0 5px}.meta{font-size:11px;color:#8b8078;margin-bottom:8px}.excerpt{font-size:12px;margin:7px 0;padding:10px 11px;background:#fbf7f2;border-radius:10px;color:#665d56}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.action{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:800}.article{background:#f5f1ed}.amazon{background:#ef9446;color:#fff}.more{width:100%;margin-top:16px;padding:14px;border:1px solid #eadfd5;border-radius:14px;background:white;font-weight:800}.note{font-size:11px;color:#91857d;margin-top:24px}.loading{padding:22px;text-align:center;color:#8c8179}@media(max-width:390px){h1{font-size:25px}.size{padding:10px 5px 12px}.size img{height:76px}.size strong{font-size:13px}.size small{font-size:8px}.summary img{width:56px;height:56px}.summary-text b{font-size:16px}.card h2{font-size:17px}}</style></head><body><main><a class="back" href="/">🏠 トップへ</a><div class="eyebrow">FIND BY DOG SIZE</div><h1>🐾 うちの子から探す</h1><p>550件の公開体験を横断して、選んだ犬サイズが明記された商品を全11カテゴリからまとめます。犬情報が書かれていない体験は推測しません。</p><div class="sizes"><button class="size" data-size="small"><img src="/small-dogw.PNG" alt="小型犬"><strong>小型犬</strong><small>チワワ・ポメ・トイプーなど</small></button><button class="size" data-size="medium"><img src="/medium-dogw.PNG" alt="中型犬"><strong>中型犬</strong><small>柴犬・コーギーなど</small></button><button class="size" data-size="large"><img src="/large-dog.PNG" alt="大型犬"><strong>大型犬</strong><small>ゴールデン・大型ミックスなど</small></button></div><div class="cats"><button class="cat active" data-cat="">すべて</button><button class="cat" data-cat="dog-shampoo">シャンプー</button><button class="cat" data-cat="dog-conditioner">コンディショナー</button><button class="cat" data-cat="pet-dryer">ドライヤー</button><button class="cat" data-cat="brush-slicker">スリッカー</button><button class="cat" data-cat="brush-comb">コーム</button><button class="cat" data-cat="brush-pin">ピンブラシ</button><button class="cat" data-cat="brush-undercoat">抜け毛ブラシ</button><button class="cat" data-cat="nail-clipper">爪切り</button><button class="cat" data-cat="nail-grinder">爪やすり</button><button class="cat" data-cat="dog-clipper">バリカン</button><button class="cat" data-cat="auto-feeder">自動給餌器</button></div><div id="summary" class="summary"><img id="summaryDog" src="/small-dogw.PNG" alt=""><div class="summary-text"><b>体験データを読み込んでいます…</b></div></div><div id="cards" class="cards"><div class="loading">🐶 550件から探しています…</div></div><button id="more" class="more" hidden>もっと見る</button><p class="note">※ 「おすすめ」は売上・人気・効果の順位ではありません。このページでは、選んだ犬サイズが明記された公開体験が見つかった商品を、該当体験数の多い順に探しやすく並べています。</p></main><script>const labels={'dog-shampoo':'犬用シャンプー','dog-conditioner':'コンディショナー','pet-dryer':'ペットドライヤー','brush-slicker':'スリッカーブラシ','brush-comb':'コーム','brush-pin':'ピンブラシ','brush-undercoat':'アンダーコートブラシ','nail-clipper':'犬用爪切り','nail-grinder':'爪やすり','dog-clipper':'犬用バリカン','auto-feeder':'自動給餌器'};const articleLinks={'dog-shampoo':'/dog-shampoo.html','dog-conditioner':'/dog-conditioner.html','pet-dryer':'/pet-dryer.html','brush-slicker':'/brush-slicker.html','brush-comb':'/brush-comb.html','brush-pin':'/brush-pin.html','brush-undercoat':'/brush-undercoat.html','nail-clipper':'/nail-clipper.html','nail-grinder':'/nail-grinder.html','dog-clipper':'/dog-clipper.html','auto-feeder':'/auto-feeder.html'};const dogImages={small:'/small-dogw.PNG',medium:'/medium-dogw.PNG',large:'/large-dog.PNG'};let reviews=[],products=[],size=new URLSearchParams(location.search).get('size')||'small',cat='',shown=10;const validSizes=['small','medium','large'];if(!validSizes.includes(size))size='small';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function grouped(){const rows=reviews.filter(r=>String(r.dog_size||'').toLowerCase()===size&&(!cat||r.category===cat));const map=new Map();for(const r of rows){const key=r.product_id;if(!map.has(key))map.set(key,{product_id:key,product_name:r.product_name,category:r.category,rows:[],breeds:new Set()});const g=map.get(key);g.rows.push(r);if(r.dog_breed)g.breeds.add(r.dog_breed)}return [...map.values()].sort((a,b)=>b.rows.length-a.rows.length||a.product_name.localeCompare(b.product_name,'ja'));}function render(){document.querySelectorAll('.size').forEach(b=>b.classList.toggle('active',b.dataset.size===size));document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));const groups=grouped();const names={small:'小型犬',medium:'中型犬',large:'大型犬'};const total=groups.reduce((n,g)=>n+g.rows.length,0);document.querySelector('#summaryDog').src=dogImages[size];document.querySelector('#summaryDog').alt=names[size];document.querySelector('.summary-text').innerHTML=`<b>${names[size]}で体験が見つかった商品 ${groups.length}件</b><span>${cat?esc(labels[cat]||cat):'全11カテゴリ横断'}・該当体験 ${total}件</span>`;const productMap=new Map(products.map(p=>[p.id,p]));document.querySelector('#cards').innerHTML=groups.slice(0,shown).map((g,i)=>{const p=productMap.get(g.product_id)||{};const snippets=g.rows.slice(0,2).map(r=>`<div class="excerpt">${esc(r.summary)}</div>`).join('');const breedText=[...g.breeds].slice(0,4).join('・')||names[size];const affiliate=/^https?:\/\//.test(p.affiliate_url||'')?`<a class="action amazon" href="${esc(p.affiliate_url)}" target="_blank" rel="sponsored noopener">Amazonで見る</a>`:'';return `<article class="card"><span class="category">${esc(labels[g.category]||g.category)}</span><h2>${i+1}. ${esc(g.product_name)}</h2><div class="meta">${g.rows.length}件の${names[size]}体験 ・ ${esc(breedText)}</div>${snippets}<div class="actions"><a class="action article" href="${esc(articleLinks[g.category]||'/review-search.html')}">カテゴリ記事を見る</a>${affiliate}</div></article>`}).join('')||'<article class="card">この条件で犬サイズが明記された商品体験はまだありません。</article>';const more=document.querySelector('#more');more.hidden=shown>=groups.length;more.textContent=`もっと見る（残り${Math.max(0,groups.length-shown)}商品）`;}document.querySelectorAll('.size').forEach(b=>b.onclick=()=>{size=b.dataset.size;shown=10;history.replaceState(null,'',`?size=${size}`);render()});document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;shown=10;render()});document.querySelector('#more').onclick=()=>{shown+=10;render()};Promise.all([fetch('/api/reviews').then(r=>{if(!r.ok)throw Error('reviews');return r.json()}),fetch('/api/products').then(r=>{if(!r.ok)throw Error('products');return r.json()})]).then(([rd,pd])=>{reviews=rd.reviews||[];products=pd.products||[];render()}).catch(()=>{document.querySelector('.summary-text').innerHTML='<b>体験データを読み込めませんでした</b>';document.querySelector('#cards').innerHTML='<div class="loading">時間をおいて再度お試しください。</div>'});</script></body></html>
