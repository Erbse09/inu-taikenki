name: tmp Run Cloudflare Chobirich probe

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Cloudflare probe result
        shell: bash
        run: |
          set -euo pipefail
          url='https://inu-taikenki.com/api/__tmp-chobirich-probe'
          for i in $(seq 1 12); do
            body=$(curl -fsS --max-time 15 "$url" 2>/dev/null || true)
            echo "attempt=$i body=$body"
            if printf '%s' "$body" | grep -q '"status"'; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "probe endpoint did not return JSON" >&2
          exit 1
