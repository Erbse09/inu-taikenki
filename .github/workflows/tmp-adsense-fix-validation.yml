name: Temporary AdSense Fix Validation

on:
  push:
    branches:
      - fix/adsense-low-value-resubmission

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Keep legacy fixture at the pre-0018 baseline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/database.mjs")
          s = p.read_text()
          old = "if(!/^\\d/.test(name)||name.startsWith('0001_')||name.startsWith('0018_'))continue;"
          new = "if(!/^\\d/.test(name)||name.startsWith('0001_')||Number(name.slice(0,4))>=18)continue;"
          if old not in s:
              raise SystemExit("legacy fixture anchor missing")
          p.write_text(s.replace(old, new))
          PY
      - name: Static and API regression tests
        run: npm test
      - name: TypeScript check
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run test:browser
