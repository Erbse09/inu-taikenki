name: Temporary Production Work Reaudit Check

on:
  push:
    branches:
      - audit/work-reaudit-fixes-20260926

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          npm install
          npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify production HTML and JS
        shell: bash
        run: |
          set -euo pipefail
          base="https://inu-taikenki.com"
          mkdir -p /tmp/inu-prod
          for path in auto-feeder dog-clipper dog-nail-grinder dog-nail-clipper dog-shampoo brush-guide brush-slicker brush-pin brush-undercoat brush-comb review-insights review-search; do
            curl -L --retry 4 --retry-delay 2 -fsS "$base/$path" -o "/tmp/inu-prod/$path.html"
            echo "PASS /$path bytes $(wc -c < "/tmp/inu-prod/$path.html")"
          done
          curl -L --retry 4 --retry-delay 2 -fsS "$base/db-review-browser.js" -o /tmp/inu-prod/db-review-browser.js

          ! grep -q "条件検索で表示する公開体験は50件です" /tmp/inu-prod/auto-feeder.html
          grep -q "その後追加された分を含む現在の収録体験を対象にします" /tmp/inu-prod/auto-feeder.html

          for file in dog-clipper dog-nail-grinder dog-nail-clipper dog-shampoo; do
            ! grep -q "このページ下部から犬のサイズ・毛質・条件で50件の体験を絞り込めます" "/tmp/inu-prod/$file.html"
            grep -q "記事作成時の分析：50件" "/tmp/inu-prod/$file.html"
          done

          grep -q "記事作成時に各ブラシ種類50件ずつを本文まで確認して分析しました" /tmp/inu-prod/brush-guide.html
          for file in brush-slicker brush-pin brush-undercoat brush-comb; do
            ! grep -q "このブラシ種類では50件の公開体験を整理しています" "/tmp/inu-prod/$file.html"
            grep -q "この記事では記事作成時に50件の公開体験を本文まで確認して分析しました" "/tmp/inu-prod/$file.html"
          done

          grep -q "skin:'皮膚配慮'" /tmp/inu-prod/review-insights.html
          grep -q "犬種そのものの判明率ではありません" /tmp/inu-prod/review-insights.html
          grep -q "犬種欄に記載あり\*" /tmp/inu-prod/review-insights.html
          grep -q "sourceUrl.startsWith('/')" /tmp/inu-prod/db-review-browser.js
          grep -q "sourceUrl.startsWith('/')?'元にしたサイト内記事を見る →':'確認元を見る ↗'" /tmp/inu-prod/review-search.html
          echo "PRODUCTION_STATIC_REAUDIT_FIXES_PASS"
      - name: Verify production rendered behavior
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/verify-production.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              for(const width of [375,390,430,768]){
                const page=await browser.newPage({viewport:{width,height:900}});
                await page.goto('https://inu-taikenki.com/review-insights',{waitUntil:'networkidle'});
                const coverage=await page.locator('.coverage').textContent();
                if(!coverage.includes('犬種欄に記載あり*')) throw new Error('breed coverage label missing @'+width+': '+coverage);
                if(coverage.includes('犬種情報あり')) throw new Error('old breed label remains @'+width);
                await page.locator('#need').selectOption('skin');
                await page.waitForTimeout(700);
                const needs=await page.locator('#needs').textContent();
                if(needs.includes('undefined')) throw new Error('undefined skin label @'+width+': '+needs);
                if(!needs.includes('皮膚配慮')) throw new Error('skin label missing @'+width+': '+needs);
                const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+1);
                if(overflow) throw new Error('horizontal overflow review-insights @'+width);
                await page.goto('https://inu-taikenki.com/auto-feeder',{waitUntil:'networkidle'});
                const autoText=await page.locator('body').textContent();
                if(autoText.includes('条件検索で表示する公開体験は50件です')) throw new Error('stale auto-feeder count @'+width);
                if(!autoText.includes('現在の収録体験')) throw new Error('live coverage explanation missing @'+width);
                await page.close();
                console.log('PASS rendered width',width);
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
          node /tmp/verify-production.cjs
          echo "PRODUCTION_RENDERED_REAUDIT_FIXES_PASS"
